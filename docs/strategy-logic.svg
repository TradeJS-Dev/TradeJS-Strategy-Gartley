<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Bullish and bearish classical Gartley geometry</title>
  <desc id="desc">Mirrored XABCD harmonic patterns with ratio ranges and confirmation through B.</desc>
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Classical Gartley XABCD</text>
  <line x1="600" y1="85" x2="600" y2="520" stroke="#cbd5e1" stroke-width="2"/>
  <text x="300" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#15803d">Bullish</text>
  <polyline points="90,410 210,130 330,300 450,165 550,385 570,260" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="330" y1="300" x2="570" y2="300" stroke="#f59e0b" stroke-width="3" stroke-dasharray="10 8"/>
  <g font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#0f172a">
    <text x="65" y="440">X</text><text x="200" y="115">A</text><text x="315" y="330">B</text><text x="445" y="150">C</text><text x="535" y="415">D</text>
  </g>
  <text x="300" y="480" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#334155">close above B confirms LONG</text>
  <text x="900" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#b91c1c">Bearish</text>
  <polyline points="650,130 770,410 890,240 1010,375 1110,155 1130,280" fill="none" stroke="#dc2626" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="890" y1="240" x2="1130" y2="240" stroke="#f59e0b" stroke-width="3" stroke-dasharray="10 8"/>
  <g font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#0f172a">
    <text x="625" y="115">X</text><text x="755" y="440">A</text><text x="875" y="225">B</text><text x="1000" y="405">C</text><text x="1095" y="140">D</text>
  </g>
  <text x="900" y="480" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#334155">close below B confirms SHORT</text>
  <g font-family="system-ui, sans-serif" font-size="15" fill="#475569">
    <text x="110" y="245">XA impulse</text><text x="235" y="245">AB/XA ≈ 0.618</text><text x="355" y="220">BC/AB 0.382–0.886</text><text x="435" y="290">CD/BC 1.13–1.618</text>
    <text x="710" y="280">XA impulse</text><text x="790" y="285">AB/XA ≈ 0.618</text><text x="915" y="330">BC/AB 0.382–0.886</text><text x="1015" y="275">CD/BC 1.13–1.618</text>
  </g>
</svg>
